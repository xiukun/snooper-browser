<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>snooper 图片查看器</title>
  <style>
    /* Self-contained viewer page: rendered inside an iframe embedded in the
       host page's shadow DOM. The extension origin's CSP governs this
       document (not the host page's), so data: and remote images both load. */
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
    }
    body {
      display: flex; align-items: center; justify-content: center;
    }
    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>
  <img id="viewer-img" alt="生成的配图">
  <script src="image-viewer.js"></script>
</body>
</html>
