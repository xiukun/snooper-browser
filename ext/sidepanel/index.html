<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>snooper-browser 笔记与集成</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div class="panel-container">
    <header class="panel-header">
      <div class="header-brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round">
            <rect x="2.6" y="2.6" width="18.8" height="18.8" rx="6" stroke-width="1.3" opacity=".5"/>
            <path d="M7.2 13.4v-2.8M10.4 16.2V7.8M13.6 14.6V9.4M16.8 12.4v-.8" stroke-width="1.8"/>
          </svg>
        </div>
        <div class="brand-info">
          <h1 class="brand-title">snooper</h1>
          <p class="brand-subtitle">笔记历史 · Obsidian 集成</p>
        </div>
      </div>
      <div id="noticeBanner" class="notice-banner" role="status" aria-live="polite" hidden></div>
    </header>

    <div class="tab-bar" role="tablist" aria-label="侧栏分区">
      <button id="tab-notes" type="button" class="tab-btn active" data-tab="notes" role="tab" aria-selected="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        笔记历史
      </button>
      <button id="tab-obsidian" type="button" class="tab-btn" data-tab="obsidian" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8v13H3V8"/><path d="M1 3h22v5H1z"/><path d="M10 12h4"/></svg>
        Obsidian
      </button>
      <button id="tab-history" type="button" class="tab-btn" data-tab="history" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        历史
      </button>
    </div>

    <main class="panel-main">
      <!-- Tab: Notes -->
      <div id="panel-notes" class="tab-content active">
        <section class="config-section">
          <div class="config-callout">
            <div class="callout-head">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7"/><path d="M4 10V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-5"/><path d="M20 12V3"/><path d="M1 14h6"/><path d="M9 8h6"/><path d="M17 16h6"/></svg>
              首次使用
            </div>
            <p class="section-desc">
              点击下方按钮即可打开配置，不必先找到悬浮栏。也可点击扩展图标显示工具栏；API Key 仅保存在本机。
            </p>
            <button id="open-page-config" type="button" class="btn btn-primary btn-sm">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              开始配置
            </button>
          </div>
        </section>

        <section class="config-section">
          <div class="section-header">
            <h2 class="section-title">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
              笔记历史
            </h2>
            <div class="section-actions">
              <button id="notes-refresh-btn" type="button" class="btn btn-secondary btn-sm">
                <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                刷新
              </button>
            </div>
          </div>
          <p class="section-desc">保存在本地的笔记文档。可导出 Markdown 或批量删除。</p>
          <div id="notes-toolbar" class="notes-toolbar">
            <label class="notes-select-all"><input id="notes-select-all" type="checkbox"> 全选</label>
            <button id="notes-delete-selected" type="button" class="btn btn-sm btn-danger" disabled>删除所选</button>
          </div>
          <div id="notes-list" class="notes-list">
            <p class="empty-hint">暂无笔记</p>
          </div>
        </section>
      </div>

      <!-- Tab: Obsidian -->
      <div id="panel-obsidian" class="tab-content">
        <section class="config-section">
          <div class="section-header">
            <h2 class="section-title">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8v13H3V8"/><path d="M1 3h22v5H1z"/><path d="M10 12h4"/></svg>
              Obsidian 集成
            </h2>
            <span class="section-badge">可选</span>
          </div>
          <p class="section-desc">将笔记发送到 Obsidian 仓库。需要安装并启用 <strong>Obsidian Local REST API</strong> 社区插件。</p>

          <div class="form-grid">
            <div class="field-group full">
              <label class="field-label field-checkbox-label">
                <input id="obsidian-enabled" type="checkbox" class="field-checkbox">
                启用 Obsidian 同步
              </label>
            </div>
            <div class="field-group half">
              <label for="obsidian-protocol" class="field-label">协议</label>
              <select id="obsidian-protocol" class="field-input">
                <option value="http">HTTP（推荐）</option>
                <option value="https">HTTPS（需信任证书）</option>
              </select>
            </div>
            <div class="field-group half">
              <label for="obsidian-port" class="field-label">端口</label>
              <input id="obsidian-port" type="number" class="field-input" value="27123" placeholder="27123">
            </div>
            <div class="field-group full">
              <label for="obsidian-folder" class="field-label">笔记目录</label>
              <input id="obsidian-folder" type="text" class="field-input" value="snooper-notes" placeholder="snooper-notes">
            </div>
            <div class="field-group full">
              <label for="obsidian-key" class="field-label">API Key（同步必填）</label>
              <input id="obsidian-key" type="password" class="field-input" value="" placeholder="在 Obsidian Local REST API 插件设置中复制">
            </div>
            <div class="field-group full">
              <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
                <button id="obsidian-test" type="button" class="btn btn-secondary">测试连接</button>
                <span id="obsidian-test-status" class="obsidian-test-status" hidden></span>
              </div>
            </div>
          </div>
        </section>
      </div>
      <div id="panel-history" class="tab-content">
        <section class="config-section">
          <div class="section-header">
            <h2 class="section-title">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              转写历史
            </h2>
            <span class="section-badge" id="history-count">0</span>
          </div>
           <p class="section-desc">开始转写后实时保存，停止、关闭页面或浏览器崩溃都不会丢失已记录的内容。展开记录可查看完整原文、译文与时间戳，复制和导出按需读取全文。</p>
          <div id="history-toolbar" class="history-toolbar">
            <label class="history-select-all">
              <input id="history-select-all" type="checkbox">
              全选
            </label>
            <button id="history-delete-selected" type="button" class="btn btn-sm btn-secondary" disabled>删除所选</button>
            <button id="history-clear" type="button" class="btn btn-sm btn-danger">清空全部</button>
          </div>
          <div id="history-list" style="display:flex;flex-direction:column;gap:8px;min-height:60px;"></div>
          <div id="history-empty" style="text-align:center;padding:28px 8px;color:var(--text-muted);font-size:13px;display:none">还没有历史记录</div>
        </section>
      </div>
    </main>

    <footer class="panel-footer">
      <div class="footer-actions">
        <button id="saveConfigBtn" type="button" class="btn btn-primary btn-save">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          保存设置
        </button>
      </div>
    </footer>
  </div>

  <script src="panel.js"></script>
</body>
</html>
